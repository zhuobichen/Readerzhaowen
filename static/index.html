<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅微 · 本地书架</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body data-view="shelf">

<!-- ============================ 书架视图 ============================ -->
<main id="view-shelf" class="view">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M5 4h5a2 2 0 0 1 2 2v14a1.5 1.5 0 0 0-1.5-1.5H5z"/>
          <path d="M19 4h-5a2 2 0 0 0-2 2v14a1.5 1.5 0 0 1 1.5-1.5H19z"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>阅微</h1>
        <p>本地书架</p>
      </div>
    </div>

    <div class="topbar-tools">
      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" type="text" placeholder="搜索书名 / 作者" autocomplete="off">
      </div>
      <select id="filter-format" class="select" title="按格式筛选">
        <option value="">全部格式</option>
      </select>
      <select id="sort-by" class="select" title="排序">
        <option value="recent">最近阅读</option>
        <option value="title">书名</option>
        <option value="added">添加时间</option>
      </select>
      <button id="btn-refresh" class="icon-btn" title="刷新书架">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
  </header>

  <section class="shelf-wrap">
    <div id="shelf" class="shelf" aria-live="polite"></div>

    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-art" aria-hidden="true">
        <svg viewBox="0 0 80 80" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="10" y="14" width="12" height="52" rx="1.5"/>
          <rect x="26" y="20" width="12" height="46" rx="1.5"/>
          <rect x="42" y="12" width="12" height="54" rx="1.5"/>
          <path d="M58 66V24c4-3 9-3 12 0v42z"/>
        </svg>
      </div>
      <h2>书架空空如也</h2>
      <p>把电子书放进 <code>books</code> 文件夹，然后点刷新。</p>
      <div class="empty-formats">
        <span>PDF</span><span>EPUB</span><span>TXT</span><span>CBZ</span>
        <span class="dim">MOBI · AZW3 · FB2 · DOCX · CBR（仅收录，部分暂不支持在线阅读）</span>
      </div>
      <button id="btn-empty-refresh" class="btn-primary">刷新书架</button>
    </div>
  </section>
</main>

<!-- ============================ 阅读器视图 ============================ -->
<main id="view-reader" class="view" hidden>
  <header class="reader-bar">
    <button id="reader-back" class="icon-btn" title="返回书架">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="reader-title">
      <span id="reader-title" class="reader-title-name">—</span>
      <span id="reader-fmt" class="fmt-badge"></span>
    </div>
    <div class="reader-tools">
      <button id="btn-mode" class="icon-btn" title="切换翻页方向" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button id="btn-zoom-out" class="icon-btn" title="缩小" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      </button>
      <span id="zoom-level" class="zoom-level" hidden>100%</span>
      <button id="btn-zoom-in" class="icon-btn" title="放大" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="btn-fit" class="icon-btn" title="适合宽度" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" title="切换主题" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="btn-notes" class="icon-btn" title="笔记">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </div>
  </header>

  <div class="reader-stage">
    <button id="page-prev" class="page-nav prev" title="上一页" aria-label="上一页">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div id="reader-area" class="reader-area"></div>
    <button id="page-next" class="page-nav next" title="下一页" aria-label="下一页">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <footer class="reader-foot">
    <span id="page-info" class="page-info">—</span>
    <div class="progress-track">
      <input id="progress-slider" type="range" min="0" max="100" value="0" step="0.1" aria-label="阅读进度">
    </div>
    <span id="progress-pct" class="progress-pct">0%</span>
  </footer>
</main>

<!-- ============================ 笔记面板 ============================ -->
<aside id="notes-panel" class="notes-panel" hidden>
  <div class="notes-header">
    <h2>笔记</h2>
    <span id="notes-book-name" class="notes-book-name"></span>
    <button id="notes-close" class="icon-btn notes-close" title="关闭">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="notes-editor">
    <textarea id="notes-input" placeholder="在此写下你的感想…" rows="4"></textarea>
    <button id="notes-save" class="btn-primary notes-save-btn">保存笔记</button>
  </div>
  <div id="notes-list" class="notes-list" aria-live="polite"></div>
  <div id="notes-empty" class="notes-empty" hidden>还没有笔记，开始记录你的阅读感想吧。</div>
</aside>

<!-- 阅读器子模板：不支持格式 -->
<template id="tpl-unsupported">
  <div class="unsupported">
    <div class="unsupported-icon">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    </div>
    <h3>暂不支持在线阅读此格式</h3>
    <p class="unsupported-fmt"></p>
    <p class="unsupported-tip">建议将其转换为 <strong>EPUB</strong> 或 <strong>PDF</strong> 后放入 <code>books</code> 文件夹。</p>
  </div>
</template>

<!-- 第三方库（本地化，离线可用） -->
<script src="/static/vendor/jszip.min.js"></script>
<script src="/static/vendor/pdf.min.js"></script>
<script src="/static/vendor/epub.min.js"></script>
<!-- 应用入口 -->
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
